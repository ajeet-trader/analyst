<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - AI Trading Analyst</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/market_clock.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <!-- Market Clock Widget -->
    <div class="market-clock-widget">
        <div class="clock-header">
            <div id="ist-clock" class="ist-clock">Loading...</div>
        </div>
        <div class="session-list">
            <div id="session-tokyo" class="session-item">
                <span class="session-name">Tokyo</span>
                <div class="session-status">
                    <span class="status-dot"></span>
                    <span class="status-text">CLOSED</span>
                </div>
            </div>
            <div id="session-london" class="session-item">
                <span class="session-name">London</span>
                <div class="session-status">
                    <span class="status-dot"></span>
                    <span class="status-text">CLOSED</span>
                </div>
            </div>
            <div id="session-new-york" class="session-item">
                <span class="session-name">New York</span>
                <div class="session-status">
                    <span class="status-dot"></span>
                    <span class="status-text">CLOSED</span>
                </div>
            </div>
            <div id="session-sydney" class="session-item">
                <span class="session-name">Sydney</span>
                <div class="session-status">
                    <span class="status-dot"></span>
                    <span class="status-text">CLOSED</span>
                </div>
            </div>
        </div>
        <div id="market-peak" class="peak-indicator">
            ⚡ NORMAL VOLATILITY
        </div>
    </div>

    <div class="dashboard">

        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">⚡</span>
                <h1>ANALYST AI - Analytics</h1>
            </div>
            <div class="nav">
                <a href="/" class="nav-link">Dashboard</a>
                <a href="/analytics" class="nav-link active">Analytics</a>
                <a href="/journal" class="nav-link">Journal</a>
                <a href="/watchlist" class="nav-link">Watchlist</a>
                <a href="/risk" class="nav-link">Risk</a>
                <a href="/settings" class="nav-link">Settings</a>
                <a href="/sessions" class="nav-link">Sessions</a>
                <a href="/help" class="nav-link">Help</a>
            </div>
        </header>
        <div class="stats-overview">
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-value" id="total-signals">0</div>
                <div class="stat-label">Total Signals</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-value" id="total-wins">0</div>
                <div class="stat-label">Wins</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">❌</div>
                <div class="stat-value" id="total-losses">0</div>
                <div class="stat-label">Losses</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📈</div>
                <div class="stat-value" id="win-rate">0%</div>
                <div class="stat-label">Win Rate</div>
            </div>
        </div>

        <!-- Charts -->
        <div class="chart-card card">
            <div class="card-header">
                <h2>Performance by Asset</h2>
            </div>
            <canvas id="assetChart"></canvas>
        </div>

        <div class="chart-card card">
            <div class="card-header">
                <h2>Performance by Pattern</h2>
            </div>
            <canvas id="patternChart"></canvas>
        </div>

        <div class="chart-card card" style="grid-column: 1 / -1;">
            <div class="card-header">
                <h2>30-Day Timeline</h2>
            </div>
            <canvas id="timelineChart"></canvas>
        </div>

    </div>
    </div>

    <script src="{{ url_for('static', filename='js/analytics.js') }}"></script>
    <script src="{{ url_for('static', filename='js/persistent_signal.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/journal_notes.css') }}">
    <script src="{{ url_for('static', filename='js/journal_notes.js') }}"></script>
    <script src="{{ url_for('static', filename='js/market_clock.js') }}"></script>
</body>

</html>
