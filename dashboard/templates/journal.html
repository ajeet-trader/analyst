<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journal - AI Trading Analyst</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="dashboard">

        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">⚡</span>
                <h1>ANALYST AI - Journal</h1>
            </div>
            <div class="nav">
                <a href="/" class="nav-link">Dashboard</a>
                <a href="/analytics" class="nav-link">Analytics</a>
                <a href="/journal" class="nav-link active">Journal</a>
                <a href="/watchlist" class="nav-link">Watchlist</a>
                <a href="/risk" class="nav-link">Risk</a>
                <a href="/settings" class="nav-link">Settings</a>
                <a href="/sessions" class="nav-link">Sessions</a>
                <a href="/help" class="nav-link">Help</a>
            </div>
        </header>

        <!-- Journal Grid -->
        <div class="journal-grid">
            <!-- Left: Trade Journal (Main) -->
            <div class="card journal-main">
                <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
                    <h2>📔 Trade Journal</h2>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn-secondary" onclick="showExportModal()"
                            style="padding: 10px 20px; background: #151a35; color: #9ca3b8; border: 1px solid #2d3a5f; border-radius: 8px; cursor: pointer; font-weight: 600;">📤
                            Export</button>
                    </div>
                </div>
                <div id="journal-list" class="journal-list">
                    <p class="empty-state">Loading journal entries...</p>
                </div>
            </div>

            <!-- Right: General Journal Entries -->
            <div class="card journal-sidebar">
                <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
                    <h2>📝 Personal Notes</h2>
                    <button class="btn-primary" onclick="showJournalEntryModal()"
                        style="padding: 8px 16px; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.9rem;">+
                        New</button>
                </div>
                <div id="notes-list" class="journal-notes-list">
                    <p class="empty-state">No personal notes yet</p>
                </div>
            </div>
        </div>
    </div>


    <link rel="stylesheet" href="{{ url_for('static', filename='css/journal_notes.css') }}">
    <script src="{{ url_for('static', filename='js/journal_notes.js') }}"></script>
    <script src="{{ url_for('static', filename='js/journal.js') }}"></script>
    <script src="{{ url_for('static', filename='js/persistent_signal.js') }}"></script>
</body>

</html>
