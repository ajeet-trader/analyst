<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sessions - AI Trading Analyst</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="dashboard">

        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">⚡</span>
                <h1>ANALYST AI - Sessions History</h1>
            </div>
            <div class="nav">
                <a href="/" class="nav-link">Dashboard</a>
                <a href="/analytics" class="nav-link">Analytics</a>
                <a href="/journal" class="nav-link">Journal</a>
                <a href="/risk" class="nav-link">Risk</a>
                <a href="/settings" class="nav-link">Settings</a>
                <a href="/sessions" class="nav-link active">Sessions</a>
                <a href="/help" class="nav-link">Help</a>
            </div>
        </header>

        <!-- Sessions Grid -->
        <div class="sessions-container">

            <!-- Sessions Table -->
            <div class="card">
                <div class="card-header">
                    <h2>📊 Trading Sessions History</h2>
                </div>

                <table class="sessions-table">
                    <thead>
                        <tr>
                            <th>Session Name</th>
                            <th>Date</th>
                            <th>Duration</th>
                            <th>Strategy</th>
                            <th>Trades</th>
                            <th>Win Rate</th>
                            <th>P&L</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="sessions-tbody">
                        <tr>
                            <td colspan="9" class="loading">Loading sessions...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <!-- Session Detail Modal -->
    <div id="session-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <span class="modal-close" onclick="closeSessionModal()">&times;</span>
            <div id="session-modal-body"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/sessions_history.js') }}"></script>
    <script src="{{ url_for('static', filename='js/persistent_signal.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/journal_notes.css') }}">
    <script src="{{ url_for('static', filename='js/journal_notes.js') }}"></script>
</body>

</html>
